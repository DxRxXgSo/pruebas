version: '3.4'

services:
  
  catalogdb:
    container_name: catalogdb
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=CatalogDb
    restart: always
    ports:
      - "5433:5432"
    volumes:
      - catalogdbdata:/var/lib/postgresql/data/

  basketdb:
    container_name: basketdb
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=BasketDb
    restart: always
    ports:
      - "5434:5432"
    volumes:
      - basketdbdata:/var/lib/postgresql/data/

  catalog.api:
    container_name: catalog.api
    build:
      context: .
      dockerfile: src/Catalog.API/Dockerfile

    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Database=Host=catalogdb;Port=5432;Database=CatalogDb;Username=postgres;Password=postgres
    ports:
      - "8080:8080"
    depends_on:
      - catalogdb

  redis:
    container_name: redis
    image: redis:7.4
    restart: always
    ports:
      - "6379:6379"

  mongodb:
    container_name: mongodb
    image: mongo:7
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodbdata:/data/db

  basket.api:
    container_name: basket.api
    build:
      context: .
      dockerfile: src/Basket/Basket.API/Dockerfile

    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Redis=redis:6379
    ports:
      - "8082:8080"
    depends_on:
      - redis

  ordering.api:
    container_name: ordering.api
    build:
      context: .
      dockerfile: src/Ordering.API/Dockerfile

    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Ordering__MongoDbConnectionString=${MONGODB_CONNECTION_STRING:-mongodb://mongodb:27017}
      - Ordering__MongoDbDatabaseName=OrderingDb
      - Ordering__BasketApiBaseUrl=http://basket.api:8080
      - Ordering__CatalogApiBaseUrl=http://catalog.api:8080
      - Ordering__TaxRate=0.16
    ports:
      - "8083:8080"
    depends_on:
      - basket.api
      - catalog.api

volumes:
  catalogdbdata:
  basketdbdata:
  mongodbdata: